name: QA Live Telegram (Convex)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref, tag, or SHA to run
        required: true
        default: main
        type: string
      scenario:
        description: Optional comma-separated Telegram scenario ids
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-live-telegram-convex-${{ inputs.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.33.0"
  OPENCLAW_BUILD_PRIVATE_QA: "1"
  OPENCLAW_ENABLE_PRIVATE_QA_CLI: "1"

jobs:
  authorize_actor:
    name: Authorize workflow actor
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Require maintainer-level repository access
        uses: actions/github-script@v8
        with:
          script: |
            const allowed = new Set(["admin", "maintain", "write"]);
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.actor,
            });
            const permission = data.permission;
            core.info(`Actor ${context.actor} permission: ${permission}`);
            if (!allowed.has(permission)) {
              core.setFailed(
                `Workflow requires write/maintain/admin access. Actor "${context.actor}" has "${permission}".`,
              );
            }

  run_live_telegram:
    name: Run Telegram live QA lane with Convex leases
    needs: authorize_actor
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    environment: qa-live-shared
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENCLAW_QA_CONVEX_SITE_URL: ${{ vars.OPENCLAW_QA_CONVEX_SITE_URL }}
      OPENCLAW_QA_CONVEX_ENDPOINT_PREFIX: ${{ vars.OPENCLAW_QA_CONVEX_ENDPOINT_PREFIX }}
      OPENCLAW_QA_CONVEX_SECRET_CI: ${{ secrets.OPENCLAW_QA_CONVEX_SECRET_CI }}
      OPENCLAW_QA_REDACT_PUBLIC_METADATA: "1"
      OPENCLAW_QA_TELEGRAM_CAPTURE_CONTENT: "0"
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          install-bun: "true"

      - name: Validate required QA credential env
        shell: bash
        run: |
          set -euo pipefail

          require_var() {
            local key="$1"
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required ${key}." >&2
              exit 1
            fi
          }

          require_var OPENAI_API_KEY
          require_var OPENCLAW_QA_CONVEX_SITE_URL
          require_var OPENCLAW_QA_CONVEX_SECRET_CI

      - name: Build private QA runtime
        run: pnpm build

      - name: Run Telegram live lane
        id: run_lane
        shell: bash
        env:
          INPUT_SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail

          output_dir=".artifacts/qa-e2e/telegram-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scenario_args=()

          if [[ -n "${INPUT_SCENARIO// }" ]]; then
            IFS=',' read -r -a raw_scenarios <<<"${INPUT_SCENARIO}"
            for raw in "${raw_scenarios[@]}"; do
              scenario="$(printf '%s' "${raw}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [[ -n "${scenario}" ]]; then
                scenario_args+=(--scenario "${scenario}")
              fi
            done
          fi

          echo "output_dir=${output_dir}" >> "$GITHUB_OUTPUT"

          pnpm openclaw qa telegram \
            --repo-root . \
            --output-dir "${output_dir}" \
            --provider-mode live-frontier \
            --model openai/gpt-5.4 \
            --alt-model openai/gpt-5.4 \
            --fast \
            --credential-source convex \
            --credential-role ci \
            "${scenario_args[@]}"

      - name: Upload Telegram QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-telegram-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run_lane.outputs.output_dir }}
          retention-days: 14
          if-no-files-found: warn
